name: Pulse rollback / manual deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version or tag to deploy (e.g. 0.1.0 or sha-3c22662)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate version input and resolve image
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            printf '::error::Invalid version/tag format: %s\n' "$VERSION"
            exit 1
          fi

          REPO_LOWER="$(echo "${{ github.repository_owner }}/omega-pulse" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LOWER}:${VERSION}"
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            ENV_FILE="deploy/staging.env"
          else
            ENV_FILE="deploy/prod.env"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "env_file=${ENV_FILE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target image exists in GHCR
        run: |
          if ! docker buildx imagetools inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            printf '::error::Image %s not found in GHCR.\n' "${{ steps.meta.outputs.image }}"
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ steps.meta.outputs.image }}
          ENV_FILE: ${{ steps.meta.outputs.env_file }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          for var in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS IMAGE ENV_FILE; do
            if [[ -z "${!var:-}" ]]; then
              printf 'Missing required configuration: %s\n' "$var" >&2
              exit 1
            fi
          done

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          ssh-add - <<< "$DEPLOY_SSH_KEY" >/dev/null 2>&1

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd ~/omega-pulse && git fetch origin main && git checkout main && git pull --ff-only origin main && DEPLOY_TRIGGERED_BY='${ACTOR}' bash deploy/deploy.sh '${ENV_FILE}' '${IMAGE}'"

