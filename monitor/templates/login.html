{% extends 'account_base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p>Step 1 of 2 · Enter your username and password.</p>
{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="account-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username <input name="username" autocomplete="username" maxlength="64" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
  <button type="submit">Continue</button>
</form>
{% endblock %}
